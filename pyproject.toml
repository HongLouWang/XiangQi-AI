[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi"
version = "0.1.0"
description = "支持桌面与程序控制接口的中国象棋游戏"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
ai = [
    "torch>=2.3",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
